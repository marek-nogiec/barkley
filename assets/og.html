<!doctype html>
<!-- Social preview card. Regenerate docs/og.png (1200x630) with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --screenshot="$PWD/docs/og.png" --window-size=1200,630 --hide-scrollbars "file://$PWD/assets/og.html" -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../docs/styles.css">
    <style>
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: 0 64px; }
      .brand { font-size: 30px; gap: 16px; margin-bottom: 30px; }
      .brand img { width: 64px; height: 64px; border-radius: 15px; }
      h1 { margin: 0 0 22px; font-size: 64px; font-weight: 760; letter-spacing: -0.035em; line-height: 1.03; }
      h1 em { color: transparent; background: linear-gradient(120deg, var(--accent), var(--accent-2)); background-clip: text; -webkit-background-clip: text; font-style: normal; }
      p { margin: 0; color: var(--ink-muted); font-size: 22px; line-height: 1.45; }
      .desktop { padding: 54px 26px; }
      .row { animation: none !important; }
      .caret { animation: none; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" class="sprite" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"></path></symbol>
      <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4.5" height="6.5" rx="1.5"></rect><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5"></rect></symbol>
      <symbol id="i-display" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M9 20h6M12 16v4"></path></symbol>
    </svg>
    <div>
      <div class="brand"><img src="../docs/favicon.svg" alt=""><span>Barkley</span></div>
      <h1>Double-tap ⌘.<br>Type. <em>Done.</em></h1>
      <p>A tiny Liquid Glass launcher for macOS.<br>Plugins are shell scripts or Rust.</p>
    </div>
    <div class="desktop">
      <div class="glass">
        <div class="query"><svg aria-hidden="true"><use href="#i-search"></use></svg><span>audio</span><i class="caret"></i></div>
        <ul class="rows">
          <li class="row"><svg class="row-icon"><use href="#i-speaker"></use></svg><span><strong>MacBook Pro Speakers</strong><small>Output · Built-in</small></span><b class="tag">Current</b></li>
          <li class="row selected"><svg class="row-icon"><use href="#i-headphones"></use></svg><span><strong>AirPods Pro</strong><small>Not connected</small></span><span class="hint">Connect <b class="key">↩</b></span></li>
          <li class="row"><svg class="row-icon"><use href="#i-display"></use></svg><span><strong>Studio Display</strong><small>Output · USB</small></span></li>
        </ul>
      </div>
    </div>
  </body>
</html>
