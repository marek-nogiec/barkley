# Supply-chain gate: `cargo deny check` (run before each tag).

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Zlib", "Unicode-3.0"]
unused-allowed-license = "allow"
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: fine for unmodified deps. Allowed per crate, not globally.
exceptions = [
    { crate = "nucleo-matcher", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

# Our own crates (all publish = false) are GPL-3.0-or-later, see LICENSE.
[licenses.private]
ignore = true

[bans]
# Two majors of the same crate means bloat or a stale dep somewhere.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
